name: Auto Draft

# 주 2회(월·목 10:00 KST) 편집 캘린더의 다음 주제로 초안을 만들어 PR로 제안한다.
# 발행은 사람이 한다: PR 검토(=사람 검증 체크리스트 통과) + 머지가 곧 승인이다.

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "글 주제/키워드"
        required: true
      level:
        description: "독자 수준 (완전초보|실무자)"
        default: "완전초보"
      stage:
        description: "확장 사다리 단계 (도구|노하우|자격증|커리어)"
        default: "도구"
      topic_tag:
        description: "주제 태그 (productivity|ai-workflows)"
        default: "productivity"
      slug:
        description: "파일명 슬러그 (선택, 영어 소문자-하이픈)"
        required: false
  schedule:
    - cron: "0 1 * * 1,4" # 매주 월·목 01:00 UTC = 10:00 KST

concurrency:
  group: auto-draft
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: 초안 생성 (1~4단계 자동)
        id: write
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AUTO_MODEL: ${{ vars.AUTO_MODEL || 'gpt-4o-mini' }}
          AUTO_TOPIC: ${{ inputs.topic }}
          AUTO_LEVEL: ${{ inputs.level }}
          AUTO_STAGE: ${{ inputs.stage }}
          AUTO_TAG: ${{ inputs.topic_tag }}
          AUTO_SLUG: ${{ inputs.slug }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          find src/content/posts -maxdepth 1 -type f -name '*.md' -print | sort > "$RUNNER_TEMP/auto-draft-before-posts"
          # 보안: 워크플로 입력값은 env 변수로만 전달한다. ${{ }} 셸 직접 치환과 eval은
          # 스크립트 인젝션(secrets 탈취) 경로가 되므로 금지한다.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            ARGS=("$AUTO_TOPIC" --level "$AUTO_LEVEL" --stage "$AUTO_STAGE" --topic "$AUTO_TAG")
            if [ -n "$AUTO_SLUG" ]; then ARGS+=(--slug "$AUTO_SLUG"); fi
            node scripts/auto-publish/auto-write.mjs "${ARGS[@]}"
          else
            node scripts/auto-publish/auto-write.mjs --calendar scripts/auto-publish/calendar.md
          fi

      - name: 초안 검증 (draft 상태인지 + 콘텐츠 계약)
        run: |
          after_posts="$(mktemp)"
          before_posts="$RUNNER_TEMP/auto-draft-before-posts"
          trap 'rm -f "$after_posts"' EXIT
          if [ ! -f "$before_posts" ]; then
            echo "::error::초안 생성 전 글 목록을 찾을 수 없습니다"
            exit 1
          fi

          # 초안 생성 단계에서 변경된 파일 목록을 기준으로 검사한다.
          # 기존 published/scheduled 글이 있다는 이유로 다음 초안이 실패하면 안 된다.
          find src/content/posts -maxdepth 1 -type f -name '*.md' -print | sort > "$after_posts"
          new_posts=()
          while IFS= read -r post; do
            if ! grep -Fqx "$post" "$before_posts"; then new_posts+=("$post"); fi
          done < "$after_posts"
          if [ "${#new_posts[@]}" -ne 1 ]; then
            echo "::error::자동화가 새 글 파일을 정확히 1개 만들어야 합니다 (감지: ${#new_posts[@]}개)"
            printf '%s\n' "${new_posts[@]}"
            exit 1
          fi
          if ! grep -Eq '^status:[[:space:]]+draft[[:space:]]*$' "${new_posts[0]}"; then
            echo "::error::자동 생성 글은 status: draft여야 합니다: ${new_posts[0]}"
            exit 1
          fi
          npm run check:content

      - name: PR 생성
        env:
          GH_TOKEN: ${{ github.token }}
          TOPIC: ${{ inputs.topic || '캘린더 다음 주제' }}
        run: |
          BR="auto-draft/$(date +%F-%H%M)"
          git config user.name "auto-draft-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$BR"
          git add -A
          git commit -m "자동 초안: ${TOPIC} (status: draft — 사람 검증 전)" || { echo "변경 없음"; exit 0; }
          git push origin "$BR"
          gh pr create \
            --title "자동 초안: ${TOPIC}" \
            --body "## 사람 검증 체크리스트 (발행 전 필수)
          - [ ] 실제로 따라 해봤는가 (스크린샷 직접 촬영)
          - [ ] \`[직접 확인 필요]\` \`[테스트 필요]\` \`[스크린샷 ...]\` \`[출처 URL 확인 필요]\` 마커를 모두 채웠는가
          - [ ] 툴 버전(\`toolVersions\`)·테스트 날짜(\`testedAt\`)·출처(\`sourceIds\`) 기입
          - [ ] 3단계 검수 리포트(out/auto-publish/)에서 감점 사유 확인
          - [ ] YMYL 조언이 섞이지 않았는가

          **머지 = 승인입니다.** 머지 후 status를 변경해 발행하세요." \
            --head "$BR"
